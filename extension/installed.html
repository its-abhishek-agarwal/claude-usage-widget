<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Usage Tracker</title>
  <link rel="stylesheet" href="installed.css">
</head>
<body>
<div class="card">
  <h1>Claude Usage Tracker</h1>
  <p>Thanks for installing! Checking whether the desktop widget is running…</p>
  <div class="status" id="status">Connecting…</div>
  <div class="steps"  id="steps"></div>
  <div id="download" class="hidden">
    <a class="btn" id="dlBtn" href="#" target="_blank">Download Widget Installer</a>
  </div>
  <br>
  <button class="btn" id="retryBtn"
    style="background:#252525;color:#e0e0e0;border:none;cursor:pointer;font-size:13px;padding:8px 18px;">
    ↺ Check Again
  </button>
</div>
<script src="installed.js"></script>
</body>
</html>
