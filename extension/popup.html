<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 230px;
      font-family: "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 14px;
    }
    h2 { font-size: 13px; margin-bottom: 10px; color: #fff; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .label { font-size: 11px; color: #999; }
    .pct   { font-size: 13px; font-weight: bold; }
    .bar-bg { background: #383838; border-radius: 3px; height: 5px; flex: 1; margin: 0 8px; }
    .bar-fill { height: 5px; border-radius: 3px; transition: width .3s; }
    .status { font-size: 10px; color: #666; margin-top: 10px; }
    .btn {
      margin-top: 8px; width: 100%; padding: 6px;
      background: #252525; color: #e0e0e0; border: none;
      border-radius: 6px; cursor: pointer; font-size: 11px;
    }
    .btn:hover { background: #2e2e2e; }
    .divider { border: none; border-top: 1px solid #2a2a2a; margin: 10px 0 8px; }
    .action-row {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      flex: 1;
      padding: 6px 8px;
      font-size: 11px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-download {
      background: #da7756;
      color: #fff;
    }
    .btn-download:hover { background: #c4634a; }
    .btn-donate {
      background: #1f1a17;
      color: #da7756;
      border: 1px solid #4a2d22;
    }
    .btn-donate:hover { background: #2b1a14; }
    .made-with {
      font-size: 10px;
      color: #444;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>Claude Usage Tracker</h2>
  <div id="content">
    <div class="status">Connecting to widget...</div>
  </div>
  <button class="btn" id="syncBtn">Sync Now</button>
  <hr class="divider">
  <div class="action-row">
    <button class="btn-action btn-download" id="downloadBtn">Download Widget</button>
    <button class="btn-action btn-donate" id="donateBtn">&#9749; Support</button>
  </div>
  <p class="made-with">Made with love &#10084;</p>
  <script src="popup.js"></script>
</body>
</html>
